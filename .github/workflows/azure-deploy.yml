name: Deploy to Azure Web App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22.x"
  # Set this repository variable to the name of the target Azure Web App.
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # A syntactically valid placeholder URL is enough for code generation and
      # the production build; no database is contacted.
      - run: npx prisma generate
        env:
          Supabase_DB_URL: "postgresql://localhost:5432/build?schema=public"

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          Supabase_DB_URL: "postgresql://localhost:5432/build?schema=public"

      - name: Assemble deployment package
        # Zipped so that dot-directories (.next, the generated .prisma client
        # and node_modules/.bin) and executable permissions survive the
        # artifact round trip; otherwise the web app starts without build
        # output and returns HTTP 503.
        run: |
          zip -r --symlinks app.zip \
            .next \
            public \
            prisma \
            node_modules \
            package.json \
            package-lock.json \
            next.config.ts \
            "TRACK QUALITY PACK.xlsx" \
            "IMDM Doncaster.pdf" \
            > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Create this environment in repository settings to require approval before release.
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Database credentials live in Azure app settings, never in this workflow.
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: app/app.zip
