# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-track-quality-pack-web-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A syntactically valid placeholder URL is enough to generate the Prisma
      # client and to build; no database is contacted at build time.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          Supabase_DB_URL: "postgresql://localhost:5432/build?schema=public"

      - name: Build
        run: npm run build
        env:
          Supabase_DB_URL: "postgresql://localhost:5432/build?schema=public"

      - name: Test
        run: npm test

      # The package is zipped here so that dot-directories (.next, the generated
      # .prisma client and node_modules/.bin) and executable permissions survive
      # the artifact round trip. Without this the web app starts with no build
      # output and returns HTTP 503.
      - name: Assemble deployment package
        run: |
          zip -r --symlinks app.zip \
            .next \
            public \
            prisma \
            node_modules \
            package.json \
            package-lock.json \
            next.config.ts \
            "TRACK QUALITY PACK.xlsx" \
            "IMDM Doncaster.pdf" \
            > /dev/null

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-track-quality-pack-web-dev'
          slot-name: 'Production'
          package: app.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8E4260FEC4FE4E8C9951C0ED2260D1A9 }}